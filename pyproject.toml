[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-policy-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "cryptography>=41", "rfc8785>=0.1.4", "tomli>=2; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]
